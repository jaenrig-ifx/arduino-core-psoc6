name: Release 0

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  
jobs:
  arduino-devops:
    uses: Infineon/arduino-devops/.github/workflows/release.yml@release-flow-auto
    with:
      release-title: arduino-core-psoc6
      setup-script: bash ./tools/dev-setup.sh
    secrets: inherit