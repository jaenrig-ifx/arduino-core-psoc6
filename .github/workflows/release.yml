name: Release auto

on:
  push:
    tags: 
      - '[0-9]+.[0-9]+.[0-9]+**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: ''
        type: choice
        options:
          - patch
          - minor
          - major
  
jobs:
  release:
    uses: Infineon/arduino-devops/.github/workflows/release-core.yml@release-flow-auto
    with:
      setup-script: bash ./tools/dev-setup.sh
      version: ${{ inputs.version }}
    secrets: inherit